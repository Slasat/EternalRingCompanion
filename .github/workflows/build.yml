name: build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/v}"
            INFO="${RAW}"
          else
            RAW="0.0.0"
            INFO="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          NUM="$(printf '%s' "${RAW}" | grep -oE '^[0-9]+(\.[0-9]+){1,3}' || echo '0.0.0')"
          echo "num=${NUM}"   >> "$GITHUB_OUTPUT"
          echo "info=${INFO}" >> "$GITHUB_OUTPUT"

      # The csproj already pins RID / self-contained / single-file / embedded-pdb
      # for Release, so publish needs nothing but the version overrides.
      - name: Publish
        run: >
          dotnet publish -c Release
          -p:Version=${{ steps.ver.outputs.num }}
          -p:InformationalVersion=${{ steps.ver.outputs.info }}
          -o publish

      - name: Name the exe
        id: pkg
        shell: bash
        run: |
          OUT="EternalRingCompanion-${{ steps.ver.outputs.info }}-win-x64.exe"
          mv publish/EternalRingCompanion.exe "publish/${OUT}"
          echo "exe=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EternalRingCompanion-win-x64
          path: publish/${{ steps.pkg.outputs.exe }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: EternalRingCompanion-win-x64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: EternalRingCompanion-*-win-x64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
